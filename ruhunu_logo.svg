<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ruhunuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind -->
  <rect x="26" y="26" width="148" height="148" rx="44" fill="#22c55e" opacity="0.35" filter="url(#glow)" />

  <!-- Main Squircle Body -->
  <rect x="22" y="22" width="156" height="156" rx="46" fill="url(#ruhunuGrad)" stroke="#86efac" stroke-width="2" stroke-opacity="0.45" />

  <!-- Glossy Highlight Curve -->
  <path d="M 26 68 C 26 38, 48 26, 78 26 L 122 26 C 152 26, 174 38, 174 68 C 140 76, 60 76, 26 68 Z" fill="url(#glossGrad)" />

  <!-- Seedling Sprout Icon (Pure White) -->
  <g fill="#ffffff" transform="translate(100, 108)">
    <!-- Right main leaf -->
    <path d="M 0 16 C 5 3, 15 -10, 36 -16 C 38 6, 28 22, 6 25 C 2 25.5, 0 25, 0 25 Z" />
    <!-- Left smaller leaf -->
    <path d="M -2 18 C -6 6, -16 -4, -32 -6 C -34 12, -24 24, -6 26 C -3 26.2, -2 26, -2 26 Z" opacity="0.95" />
    <!-- Center growing bud / stem -->
    <path d="M -3 32 C -3 18, -1 8, 3 -2 C 6 -12, 12 -26, 8 -34 C -1 -30, -6 -16, -7 -4 C -7 8, -6 20, -5 32 Z" />
  </g>
</svg>