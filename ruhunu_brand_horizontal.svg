<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="ruhunuGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="glowHoriz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="20" y="20" width="120" height="120" rx="36" fill="#22c55e" opacity="0.32" filter="url(#glowHoriz)" />

  <!-- Squircle Emblem -->
  <rect x="18" y="18" width="124" height="124" rx="38" fill="url(#ruhunuGradHoriz)" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Seedling Icon -->
  <g fill="#ffffff" transform="translate(80, 86) scale(0.82)">
    <path d="M 0 16 C 5 3, 15 -10, 36 -16 C 38 6, 28 22, 6 25 C 2 25.5, 0 25, 0 25 Z" />
    <path d="M -2 18 C -6 6, -16 -4, -32 -6 C -34 12, -24 24, -6 26 C -3 26.2, -2 26, -2 26 Z" opacity="0.95" />
    <path d="M -3 32 C -3 18, -1 8, 3 -2 C 6 -12, 12 -26, 8 -34 C -1 -30, -6 -16, -7 -4 C -7 8, -6 20, -5 32 Z" />
  </g>

  <!-- Typography -->
  <text x="165" y="78" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#111827" letter-spacing="4">RUHUNU PRODUCTS</text>
  <text x="168" y="112" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" letter-spacing="6">BILLING SUITE</text>
</svg>